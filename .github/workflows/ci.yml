name: CI

# Repositório público: o GitHub Actions é gratuito. Se ele voltar a ser privado, os
# minutos passam a ser cobrados — troque por `workflow_dispatch:` (só manual).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # xmllint valida todo XML gerado contra o XSD oficial da SEFAZ. Sem ele, os testes de
      # leiaute são pulados — no CI isso não pode acontecer.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: make check
