name: CI

# Só manual: o repositório é privado e o GitHub Actions cobra minutos em repositório
# privado. A conferência de cada commit é o `make check` local. Se o código abrir, volte
# para `push: { branches: [main] }` e `pull_request:`.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # xmllint valida todo XML gerado contra o XSD oficial da SEFAZ. Sem ele, os testes de
      # leiaute são pulados — no CI isso não pode acontecer.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: make check
